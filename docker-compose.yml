services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: risktrix-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: risktrix_db
      POSTGRES_USER: risktrix_user
      POSTGRES_PASSWORD: risktrix_secure_password_2024
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    ports:
      - "5432:5432"
    networks:
      - risktrix-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U risktrix_user -d risktrix_db"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis for caching and sessions
  redis:
    image: redis:7-alpine
    container_name: risktrix-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - risktrix-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # RiskTrix Backend API
  backend:
    build: .
    container_name: risktrix-backend
    restart: unless-stopped
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
      - POSTGRES_SERVER=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=risktrix_user
      - POSTGRES_PASSWORD=risktrix_secure_password_2024
      - POSTGRES_DB=risktrix_db
      - REDIS_URL=redis://redis:6379
      - SECRET_KEY=your-super-secret-production-key-change-this
    ports:
      - "8000:8000"
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    networks:
      - risktrix-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Nginx Reverse Proxy (Optional)
  nginx:
    image: nginx:alpine
    container_name: risktrix-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    networks:
      - risktrix-network
    depends_on:
      - backend
    profiles:
      - production

  # Database Backup Service
  backup:
    image: postgres:15-alpine
    container_name: risktrix-backup
    restart: "no"
    environment:
      PGPASSWORD: risktrix_secure_password_2024
    volumes:
      - ./backups:/backups
      - ./scripts/backup.sh:/backup.sh
    networks:
      - risktrix-network
    depends_on:
      - postgres
    command: /backup.sh
    profiles:
      - backup

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  risktrix-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16